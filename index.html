<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chris's Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500&display=swap">

<style>
/* ── Tokens ─────────────────────────────────────────────────── */
:root {
  --bg:       #0C1210;
  --s1:       #131A16;
  --s2:       #1A2420;
  --s3:       #22302A;
  --accent:   #5AAF80;
  --accent-d: #0F2318;
  --warm:     #E07A5F;
  --warm-d:   #271408;
  --blue:     #6B9FE4;
  --blue-d:   #0E1B2E;
  --t1:       #DDE8E2;
  --t2:       #7A9B8A;
  --t3:       #3E5A4A;
  --border:   #1F3028;
  --radius:   14px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F5F3; --s1: #FFFFFF; --s2: #EAF0EC; --s3: #DEE8E2;
    --accent: #2E7A52; --accent-d: #E0F0E8;
    --warm: #C4613A; --warm-d: #FAE8E2;
    --blue: #3A6FC0; --blue-d: #E2ECF8;
    --t1: #0F1C14; --t2: #4A6A58; --t3: #9AB8A8; --border: #D0DDD6;
  }
}
:root[data-theme="light"] {
  --bg: #F2F5F3; --s1: #FFFFFF; --s2: #EAF0EC; --s3: #DEE8E2;
  --accent: #2E7A52; --accent-d: #E0F0E8;
  --warm: #C4613A; --warm-d: #FAE8E2;
  --blue: #3A6FC0; --blue-d: #E2ECF8;
  --t1: #0F1C14; --t2: #4A6A58; --t3: #9AB8A8; --border: #D0DDD6;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg); color: var(--t1);
  min-height: 100vh; font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ─────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 0;
}
.greeting-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px; font-weight: 600; color: var(--t1); line-height: 1.1;
}
.greeting-sub { font-size: 13px; color: var(--t2); margin-top: 2px; }
.topbar-right { display: flex; gap: 8px; align-items: center; }

.btn-icon {
  width: 34px; height: 34px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--s1);
  color: var(--t2); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.btn-icon:hover { background: var(--s2); color: var(--t1); }

.btn-save {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: opacity .15s; white-space: nowrap;
}
.btn-save:hover { opacity: .85; }
.btn-save:disabled { opacity: .5; cursor: default; }

.grid {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 14px;
  padding: 14px 20px 80px;
}
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.col-left  { display: flex; flex-direction: column; gap: 14px; }
.col-right { display: flex; flex-direction: column; gap: 14px; }

/* ── Cards ─────────────────────────────────────────────────── */
.card {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 0; margin-bottom: 12px;
}
.card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase; color: var(--t3);
}
.card-action {
  background: none; border: none; cursor: pointer;
  font-size: 18px; line-height: 1; color: var(--t2);
  transition: color .15s; padding: 0;
}
.card-action:hover { color: var(--accent); }
.card-body { padding: 0 16px 16px; }

/* ── Weather ─────────────────────────────────────────────────── */
.wx-main {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 10px;
}
.wx-temp {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 48px; font-weight: 700; color: var(--t1); line-height: 1;
}
.wx-unit { font-size: 20px; color: var(--t2); font-weight: 400; }
.wx-icon { font-size: 40px; line-height: 1; }
.wx-desc { font-size: 13px; color: var(--t2); margin-bottom: 4px; }
.wx-city { font-weight: 500; color: var(--t1); }
.wx-forecast {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 6px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 10px;
}
.wx-day {
  background: var(--s2); border-radius: 8px; padding: 8px 6px; text-align: center;
}
.wx-day-name { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }
.wx-day-icon { font-size: 20px; margin-bottom: 4px; }
.wx-day-temps { font-size: 12px; color: var(--t2); }
.wx-day-temps strong { color: var(--t1); font-weight: 500; }
.wx-loading { padding: 28px 0; text-align: center; font-size: 13px; color: var(--t2); }
.wx-error   { padding: 16px 0; text-align: center; font-size: 13px; color: var(--warm); }
.wx-city-form { display: flex; gap: 8px; margin-top: 12px; }
.wx-city-input {
  flex: 1; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px;
  font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--t1);
}
.wx-city-input:focus { outline: none; border-color: var(--accent); }
.wx-city-btn {
  padding: 8px 12px; border-radius: 8px;
  background: var(--accent); color: #fff; border: none;
  font-size: 13px; cursor: pointer; font-family: 'Outfit', sans-serif;
}
.wx-city-btn:hover { opacity: .85; }

/* ── Map ─────────────────────────────────────────────────── */
.map-iframe {
  width: 100%; height: 300px; border: none;
  border-radius: 9px; display: block;
}
.map-search-row {
  display: flex; gap: 6px; margin-top: 10px;
}
.map-search-input {
  flex: 1; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px;
  font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--t1);
}
.map-search-input:focus { outline: none; border-color: var(--accent); }
.map-search-btn {
  padding: 8px 13px; border-radius: 8px;
  background: var(--accent); color: #fff; border: none;
  font-size: 13px; cursor: pointer; font-family: 'Outfit', sans-serif;
  white-space: nowrap;
}
.map-search-btn:hover { opacity: .85; }
.map-open-link {
  display: block; margin-top: 8px;
  font-size: 11.5px; color: var(--blue); text-decoration: none; text-align: right;
}
.map-open-link:hover { text-decoration: underline; }

/* ── Calendar ─────────────────────────────────────────────────── */
.cal-embed {
  width: 100%; border: none; border-radius: 9px;
  min-height: 400px; background: var(--s2);
}
.cal-setup {
  padding: 20px 0; display: flex; flex-direction: column;
  align-items: center; text-align: center; gap: 10px;
}
.cal-setup-icon { font-size: 32px; }
.cal-setup-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: var(--t1); }
.cal-setup-desc { font-size: 12px; color: var(--t2); line-height: 1.6; max-width: 300px; }
.cal-url-form { display: flex; gap: 6px; width: 100%; }
.cal-url-input {
  flex: 1; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 11px;
  font-family: 'Outfit', sans-serif; font-size: 12px; color: var(--t1);
}
.cal-url-input:focus { outline: none; border-color: var(--accent); }
.cal-url-btn {
  padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #fff;
  border: none; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Outfit', sans-serif;
}
.cal-url-btn:hover { opacity: .85; }
.cal-help-link { font-size: 11px; color: var(--blue); text-decoration: none; }
.cal-help-link:hover { text-decoration: underline; }
.cal-change-btn {
  background: none; border: none; cursor: pointer;
  font-size: 12px; color: var(--t3); padding: 0; transition: color .15s;
}
.cal-change-btn:hover { color: var(--warm); }

/* ── Jobs ─────────────────────────────────────────────────── */
.jobs-filter-row {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
}
.jobs-chip {
  padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500;
  border: 1px solid var(--border); background: var(--s2); color: var(--t2);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.jobs-chip.active { background: var(--accent-d); border-color: var(--accent); color: var(--accent); }
.jobs-chip:hover:not(.active) { border-color: var(--t3); color: var(--t1); }
.job-item {
  display: flex; flex-direction: column; gap: 3px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.job-item:first-child { padding-top: 0; }
.job-item:last-child  { border-bottom: none; padding-bottom: 0; }
.job-title {
  font-size: 13px; font-weight: 500; color: var(--t1);
  text-decoration: none; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.job-title:hover { color: var(--accent); }
.job-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.job-company {
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 20px;
}
.job-location { font-size: 11px; color: var(--t2); }
.job-dept     { font-size: 11px; color: var(--t3); }
.jobs-loading { padding: 20px 0; text-align: center; font-size: 13px; color: var(--t2); }
.jobs-empty   { padding: 12px 0; font-size: 13px; color: var(--t3); }
.jobs-search-row { display: flex; gap: 6px; margin-bottom: 12px; }
.jobs-search-inp {
  flex: 1; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px;
  font-family: 'Outfit', sans-serif; font-size: 12px; color: var(--t1);
}
.jobs-search-inp:focus { outline: none; border-color: var(--accent); }
.jobs-count { font-size: 11px; color: var(--t3); margin-bottom: 10px; }

/* ── Settings modal ─────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  z-index: 200; display: none; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s;
}
.modal-backdrop.open { opacity: 1; }
.modal {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--radius); width: 100%; max-width: 400px;
  padding: 24px; transform: scale(.97);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-backdrop.open .modal { transform: scale(1); }
.modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 20px; }
.settings-field { margin-bottom: 14px; }
.settings-label {
  display: block; font-size: 11px; font-weight: 600;
  letter-spacing: .07em; text-transform: uppercase; color: var(--t2); margin-bottom: 6px;
}
.settings-input {
  width: 100%; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px;
  font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--t1);
  -webkit-appearance: none;
}
.settings-input:focus { outline: none; border-color: var(--accent); }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.btn { padding: 9px 18px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
.btn-primary   { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--s2); color: var(--t1); border: 1px solid var(--border); }
.btn:hover { opacity: .85; }

/* ── Misc ─────────────────────────────────────────────────── */
.save-status { font-size: 11px; color: var(--t3); font-style: italic; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin .7s linear infinite; }
</style>
</head>
<body>

<!-- ── Top bar ── -->
<div class="topbar">
  <div>
    <div class="greeting-name" id="greeting-name">Good morning, Chris</div>
    <div class="greeting-sub"  id="greeting-sub"></div>
  </div>
  <div class="topbar-right">
    <span class="save-status" id="save-status"></span>
    <button class="btn-icon" id="btn-settings" title="Settings">⚙</button>
    <button class="btn-save" id="btn-save">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
  </div>
</div>

<!-- ── Grid ── -->
<div class="grid">

  <!-- Left column -->
  <div class="col-left">

    <!-- Weather -->
    <div class="card">
      <div class="card-header">
        <span class="card-title" id="wx-card-title">Weather</span>
        <button class="card-action" id="btn-refresh-wx" title="Refresh">↻</button>
      </div>
      <div id="wx-body" class="card-body">
        <div class="wx-loading">Loading weather…</div>
      </div>
    </div>

    <!-- Map -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Map</span>
        <button class="card-action" id="btn-map-reset" title="Reset to Amsterdam" style="font-size:12px;font-family:'Outfit',sans-serif;letter-spacing:.04em">Amsterdam</button>
      </div>
      <div class="card-body" style="padding-bottom:16px">
        <iframe
          id="map-iframe"
          class="map-iframe"
          src="https://maps.google.com/maps?q=Amsterdam,Netherlands&z=13&output=embed"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
        <div class="map-search-row">
          <input class="map-search-input" id="map-search-inp" placeholder="Search a place…" type="text">
          <button class="map-search-btn" id="btn-map-search">Search</button>
        </div>
        <a class="map-open-link" id="map-open-link" href="https://maps.google.com" target="_blank" rel="noopener">Open in Google Maps ↗</a>
      </div>
    </div>

  </div>

  <!-- Right column -->
  <div class="col-right">

    <!-- Google Calendar -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Google Calendar</span>
        <button class="card-action cal-change-btn" id="btn-cal-change" title="Change embed URL" style="font-size:12px;display:none">Change URL</button>
      </div>
      <div class="card-body" id="cal-body"></div>
    </div>

    <!-- Jobs -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Vacancies</span>
        <button class="card-action" id="btn-refresh-jobs" title="Refresh">↻</button>
      </div>
      <div class="card-body">
        <div class="jobs-filter-row" id="jobs-chips"></div>
        <input class="jobs-search-inp" id="jobs-search" placeholder="Filter by keyword…" type="text">
        <div class="jobs-count" id="jobs-count"></div>
        <div id="jobs-body"><div class="jobs-loading">Loading vacancies…</div></div>
      </div>
    </div>

  </div>
</div>

<!-- ── Settings modal ── -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-title">Settings</div>
    <div class="settings-field">
      <label class="settings-label" for="s-name">Your name</label>
      <input class="settings-input" id="s-name" placeholder="Chris">
    </div>
    <div class="settings-field">
      <label class="settings-label" for="s-city">City (weather)</label>
      <input class="settings-input" id="s-city" placeholder="Amsterdam">
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="s-cancel">Cancel</button>
      <button class="btn btn-primary"   id="s-save">Save settings</button>
    </div>
  </div>
</div>

<script>
// ── Default state ───────────────────────────────────────────────
const DEFAULTS = {
  name:        'Chris',
  city:        'Amsterdam',
  calendarUrl: '',
};

// ── Load / persist state via localStorage ──────────────────────
function loadState() {
  try {
    const saved = localStorage.getItem('dash-state');
    if (saved) return { ...DEFAULTS, ...JSON.parse(saved) };
  } catch {}
  return { ...DEFAULTS };
}

function saveState() {
  try { localStorage.setItem('dash-state', JSON.stringify(state)); } catch {}
}

const state = loadState();

// ── Helpers ────────────────────────────────────────────────────
const esc = s => !s ? '' : String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── Clock ──────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h   = now.getHours();
  const tod = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  document.getElementById('greeting-name').textContent = `Good ${tod}, ${state.name}`;
  document.getElementById('greeting-sub').textContent  =
    `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()} · ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
  document.title = `${state.name}'s Dashboard`;
}
setInterval(updateClock, 1000); updateClock();

// ── Map ────────────────────────────────────────────────────────
const MAP_DEFAULT_QUERY = 'Amsterdam,Netherlands';
const MAP_DEFAULT = `https://maps.google.com/maps?q=${encodeURIComponent(MAP_DEFAULT_QUERY)}&z=13&output=embed`;

function updateMapLink(query) {
  const link = document.getElementById('map-open-link');
  if (link) link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

function showOnMap(location, zoom) {
  if (!location) return;
  const z = zoom || 15;
  const iframe = document.getElementById('map-iframe');
  if (!iframe) return;
  iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(location)}&z=${z}&output=embed`;
  updateMapLink(location);
}
window.showOnMap = showOnMap;

// ── Weather ────────────────────────────────────────────────────
const WMO = {
  0:'☀️ Clear',1:'🌤️ Mainly clear',2:'⛅ Partly cloudy',3:'☁️ Overcast',
  45:'🌫️ Fog',48:'🌫️ Icy fog',
  51:'🌦️ Light drizzle',53:'🌦️ Drizzle',55:'🌧️ Heavy drizzle',
  61:'🌧️ Light rain',63:'🌧️ Rain',65:'🌧️ Heavy rain',
  71:'🌨️ Light snow',73:'❄️ Snow',75:'❄️ Heavy snow',77:'🌨️ Snow grains',
  80:'🌦️ Showers',81:'🌧️ Rain showers',82:'🌧️ Heavy showers',
  85:'🌨️ Snow showers',86:'❄️ Heavy snow showers',
  95:'⛈️ Thunderstorm',96:'⛈️ Thunderstorm + hail',99:'⛈️ Thunderstorm + hail',
};
const wmoIcon = c => (WMO[c]||'🌡️ Unknown').split(' ')[0];
const wmoDesc = c => (WMO[c]||'Unknown').split(' ').slice(1).join(' ');
const fmtDay  = s => { const [y,m,d]=s.split('-').map(Number); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(y,m-1,d).getDay()]; };

async function fetchWeather(lat, lon, cityName) {
  const res  = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,windspeed_10m&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto&forecast_days=4&wind_speed_unit=kmh`);
  const data = await res.json();
  const cur  = data.current;
  const d    = data.daily;
  document.getElementById('wx-card-title').textContent = cityName + ' Weather';
  document.getElementById('wx-body').innerHTML = `
    <div class="wx-main">
      <div>
        <div class="wx-temp">${Math.round(cur.temperature_2m)}<span class="wx-unit">°C</span></div>
        <div class="wx-desc">${wmoDesc(cur.weathercode)} · ${Math.round(cur.windspeed_10m)} km/h</div>
        <div class="wx-desc"><span class="wx-city">${esc(cityName)}</span></div>
      </div>
      <div class="wx-icon">${wmoIcon(cur.weathercode)}</div>
    </div>
    <div class="wx-forecast">
      ${[1,2,3].map(i=>`<div class="wx-day">
        <div class="wx-day-name">${fmtDay(d.time[i])}</div>
        <div class="wx-day-icon">${wmoIcon(d.weathercode[i])}</div>
        <div class="wx-day-temps"><strong>${Math.round(d.temperature_2m_max[i])}°</strong> / ${Math.round(d.temperature_2m_min[i])}°</div>
      </div>`).join('')}
    </div>
    <div class="wx-city-form">
      <input class="wx-city-input" id="wx-city-inp" placeholder="Change city…">
      <button class="wx-city-btn" id="wx-city-btn">Go</button>
    </div>`;
  bindCityBtn();
}

function showWxError(msg) {
  document.getElementById('wx-body').innerHTML = `
    <div class="wx-error">${esc(msg)}</div>
    <div class="wx-city-form" style="margin-top:0">
      <input class="wx-city-input" id="wx-city-inp" placeholder="Enter city…">
      <button class="wx-city-btn" id="wx-city-btn">Go</button>
    </div>`;
  bindCityBtn();
}

function bindCityBtn() {
  const btn = document.getElementById('wx-city-btn');
  if (!btn) return;
  const go = async () => {
    const v = document.getElementById('wx-city-inp')?.value.trim();
    if (!v) return;
    state.city = v;
    document.getElementById('wx-body').innerHTML = '<div class="wx-loading">Looking up…</div>';
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=1&language=en&format=json`);
      const j = await r.json();
      if (!j.results?.length) throw new Error('City not found');
      const {latitude:lat, longitude:lon, name, country} = j.results[0];
      await fetchWeather(lat, lon, name + (country?', '+country:''));
    } catch { showWxError(`"${v}" not found — try another city name.`); }
  };
  btn.addEventListener('click', go);
  document.getElementById('wx-city-inp')?.addEventListener('keydown', e => { if(e.key==='Enter') go(); });
}

async function loadWeather() {
  const el = document.getElementById('wx-body');
  el.innerHTML = '<div class="wx-loading">Loading weather…</div>';
  if (state.city) {
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(state.city)}&count=1&language=en&format=json`);
      const j = await r.json();
      if (!j.results?.length) throw new Error();
      const {latitude:lat,longitude:lon,name,country} = j.results[0];
      await fetchWeather(lat, lon, name+(country?', '+country:''));
      return;
    } catch { showWxError(`Could not load weather for "${state.city}".`); return; }
  }
  if (!navigator.geolocation) { showWxError('Enter a city to see weather.'); return; }
  navigator.geolocation.getCurrentPosition(
    async p => {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${p.coords.latitude}&lon=${p.coords.longitude}&format=json`);
        const j = await r.json();
        const city = j.address?.city || j.address?.town || 'Your location';
        await fetchWeather(p.coords.latitude, p.coords.longitude, city);
      } catch { await fetchWeather(p.coords.latitude, p.coords.longitude, 'Your location'); }
    },
    () => showWxError('Location denied — enter a city above.'),
    { timeout: 8000 }
  );
}

// ── Jobs / Vacancies ───────────────────────────────────────────
const JOB_COMPANIES = [
  { name: 'All',         color: '#5AAF80', slug: null },
  { name: 'Adyen',       color: '#0ABF53', lever: 'adyen',       url: 'https://careers.adyen.com' },
  { name: 'Booking.com', color: '#003B95', greenhouse: 'bookingcom', url: 'https://jobs.booking.com' },
  { name: 'Mollie',      color: '#FF6640', lever: 'mollie',      url: 'https://www.mollie.com/en/jobs' },
  { name: 'Stripe',      color: '#635BFF', greenhouse: 'stripe', url: 'https://stripe.com/jobs' },
  { name: 'ASML',        color: '#00A0E3', greenhouse: 'asml',   url: 'https://www.asml.com/en/careers' },
  { name: 'Picnic',      color: '#7CB925', lever: 'picnic',      url: 'https://picnic.app/nl/over-ons/vacatures/' },
];

let allJobs = [];
let activeCompany = 'All';

async function fetchGreenhouse(slug) {
  try {
    const res = await fetch(`https://boards-api.greenhouse.io/v1/boards/${slug}/jobs`, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error();
    const data = await res.json();
    return (data.jobs || []).map(j => ({
      title:    j.title,
      url:      j.absolute_url,
      location: (j.location?.name || ''),
      dept:     (j.departments?.[0]?.name || ''),
      company:  slug,
    }));
  } catch { return []; }
}

async function fetchLever(slug) {
  try {
    const res = await fetch(`https://api.lever.co/v0/postings/${slug}?mode=json`, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error();
    const data = await res.json();
    return (Array.isArray(data) ? data : []).map(j => ({
      title:    j.text,
      url:      j.hostedUrl,
      location: j.categories?.location || j.workplaceType || '',
      dept:     j.categories?.team || j.categories?.department || '',
      company:  slug,
    }));
  } catch { return []; }
}

async function loadJobs() {
  document.getElementById('jobs-body').innerHTML = '<div class="jobs-loading"><span class="spin">↻</span> Loading…</div>';
  document.getElementById('jobs-count').textContent = '';

  const fetches = JOB_COMPANIES.filter(c => c.slug !== null).map(c => {
    if (c.greenhouse) return fetchGreenhouse(c.greenhouse).then(jobs => jobs.map(j => ({ ...j, company: c.name, companyColor: c.color, companyUrl: c.url })));
    if (c.lever)      return fetchLever(c.lever).then(jobs =>      jobs.map(j => ({ ...j, company: c.name, companyColor: c.color, companyUrl: c.url })));
    return Promise.resolve([]);
  });

  const results = await Promise.all(fetches);
  allJobs = results.flat();
  renderJobs();
}

function renderJobs() {
  const searchQ   = (document.getElementById('jobs-search')?.value || '').toLowerCase().trim();
  const filtered  = allJobs.filter(j => {
    const matchCompany = activeCompany === 'All' || j.company === activeCompany;
    const matchSearch  = !searchQ ||
      j.title.toLowerCase().includes(searchQ) ||
      j.dept.toLowerCase().includes(searchQ) ||
      j.location.toLowerCase().includes(searchQ);
    return matchCompany && matchSearch;
  });

  // Sort: Amsterdam/Netherlands first
  filtered.sort((a, b) => {
    const aAms = /amsterdam|netherlands|nl\b/i.test(a.location) ? 0 : 1;
    const bAms = /amsterdam|netherlands|nl\b/i.test(b.location) ? 0 : 1;
    return aAms - bAms;
  });

  const shown = filtered.slice(0, 20);
  const countEl = document.getElementById('jobs-count');
  countEl.textContent = filtered.length ? `${filtered.length} open role${filtered.length!==1?'s':''}` : '';

  if (!shown.length) {
    document.getElementById('jobs-body').innerHTML =
      `<div class="jobs-empty">${allJobs.length ? 'No matches — try a different filter.' : 'Could not load vacancies. Check back later.'}</div>`;
    return;
  }

  document.getElementById('jobs-body').innerHTML = shown.map(j => {
    const loc = j.location ? `📍 ${esc(j.location)}` : '';
    return `<div class="job-item">
      <a class="job-title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      <div class="job-meta">
        <span class="job-company" style="background:${j.companyColor}22;color:${j.companyColor}">${esc(j.company)}</span>
        ${loc ? `<span class="job-location">${loc}</span>` : ''}
        ${j.dept ? `<span class="job-dept">${esc(j.dept)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderJobChips() {
  const row = document.getElementById('jobs-chips');
  row.innerHTML = JOB_COMPANIES.map(c =>
    `<button class="jobs-chip${c.name === activeCompany ? ' active' : ''}" data-co="${c.name}">${c.name}</button>`
  ).join('');
  row.addEventListener('click', e => {
    const btn = e.target.closest('.jobs-chip');
    if (!btn) return;
    activeCompany = btn.dataset.co;
    document.querySelectorAll('.jobs-chip').forEach(b => b.classList.toggle('active', b.dataset.co === activeCompany));
    renderJobs();
  });
}

// ── Google Calendar ────────────────────────────────────────────
function renderCalendar() {
  const body = document.getElementById('cal-body');
  const changeBtn = document.getElementById('btn-cal-change');
  if (state.calendarUrl) {
    body.innerHTML = `
      <iframe class="cal-embed" src="${esc(state.calendarUrl)}" frameborder="0" scrolling="no" allowfullscreen></iframe>
      <div style="padding-top:8px;font-size:11px;color:var(--t3)">
        Your Google Calendar · <a class="cal-help-link" href="https://calendar.google.com" target="_blank">Open Calendar ↗</a>
      </div>`;
    changeBtn.style.display = 'inline-block';
  } else {
    changeBtn.style.display = 'none';
    body.innerHTML = `
      <div class="cal-setup">
        <div class="cal-setup-icon">📅</div>
        <div class="cal-setup-title">Connect your Google Calendar</div>
        <div class="cal-setup-desc">
          Open Google Calendar → Settings (⚙) → your calendar → "Integrate calendar" → copy the <strong>Embed code</strong> URL and paste it below.
        </div>
        <div class="cal-url-form">
          <input class="cal-url-input" id="cal-url-inp" placeholder="https://calendar.google.com/calendar/embed?src=…" type="url">
          <button class="cal-url-btn" id="cal-url-btn">Connect</button>
        </div>
        <a class="cal-help-link" href="https://support.google.com/calendar/answer/41207" target="_blank" rel="noopener">How to find the embed URL ↗</a>
      </div>`;
    document.getElementById('cal-url-btn').addEventListener('click', () => {
      const url = document.getElementById('cal-url-inp').value.trim();
      if (!url) return;
      state.calendarUrl = url;
      saveState();
      renderCalendar();
    });
    document.getElementById('cal-url-inp').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('cal-url-btn').click();
    });
  }
}

// ── Settings ───────────────────────────────────────────────────
function openSettings() {
  document.getElementById('s-name').value = state.name;
  document.getElementById('s-city').value = state.city;
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex';
  requestAnimationFrame(() => bd.classList.add('open'));
}
function closeSettings() {
  const bd = document.getElementById('modal-backdrop');
  bd.classList.remove('open');
  setTimeout(() => { bd.style.display='none'; }, 220);
}

// ── Save to localStorage ───────────────────────────────────────
function saveDash() {
  const btn    = document.getElementById('btn-save');
  const status = document.getElementById('save-status');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">↻</span> Saving…';
  saveState();
  setTimeout(() => {
    status.textContent = `Saved ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
    btn.disabled = false;
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save`;
  }, 400);
}

// ── Init ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-refresh-wx').addEventListener('click', loadWeather);
  document.getElementById('btn-settings').addEventListener('click', openSettings);
  document.getElementById('s-cancel').addEventListener('click', closeSettings);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeSettings();
  });

  document.getElementById('btn-map-reset').addEventListener('click', () => {
    document.getElementById('map-iframe').src = MAP_DEFAULT;
    updateMapLink(MAP_DEFAULT_QUERY);
  });

  const mapGoFn = () => {
    const q = document.getElementById('map-search-inp').value.trim();
    if (!q) return;
    showOnMap(q, 14);
    document.getElementById('map-search-inp').value = '';
  };
  document.getElementById('btn-map-search').addEventListener('click', mapGoFn);
  document.getElementById('map-search-inp').addEventListener('keydown', e => {
    if (e.key === 'Enter') mapGoFn();
  });

  document.getElementById('s-save').addEventListener('click', () => {
    state.name = document.getElementById('s-name').value.trim() || state.name;
    state.city = document.getElementById('s-city').value.trim();
    saveState();
    closeSettings();
    updateClock();
    loadWeather();
  });

  document.getElementById('btn-cal-change').addEventListener('click', () => {
    state.calendarUrl = '';
    saveState();
    renderCalendar();
  });

  document.getElementById('btn-save').addEventListener('click', saveDash);
  document.getElementById('btn-refresh-jobs').addEventListener('click', loadJobs);
  document.getElementById('jobs-search').addEventListener('input', renderJobs);

  // Set initial "Open in Google Maps" link
  updateMapLink(MAP_DEFAULT_QUERY);

  // Initial renders
  renderCalendar();
  renderJobChips();
  loadWeather();
  loadJobs();
});
</script>
