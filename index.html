<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chris's Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500&display=swap">
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDzQksaZa9B68nj3E4bWsOvfxz-OJYGo48&libraries=places&callback=initMap"></script>

<style>
/* ── Tokens — Amsterdam Canal ───────────────────────────────── */
:root {
  --bg:       #0A1622;
  --s1:       #111F2E;
  --s2:       #182C3F;
  --s3:       #1F3850;
  --accent:   #4EA8D2;
  --accent-d: #0D1E2E;
  --warm:     #E07A5F;
  --warm-d:   #200F09;
  --blue:     #7EC8E3;
  --blue-d:   #0C1D28;
  --t1:       #D8ECF5;
  --t2:       #7AAEBF;
  --t3:       #3A6678;
  --border:   #1A3448;
  --radius:   14px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F0F7FB; --s1: #FFFFFF; --s2: #E6F3F8; --s3: #D4E9F2;
    --accent: #2878A0; --accent-d: #D0E8F5;
    --warm: #C4613A; --warm-d: #FAE8E2;
    --blue: #3A7FA0; --blue-d: #DFF0F5;
    --t1: #091922; --t2: #3A6880; --t3: #8AB0C5; --border: #BDD4E0;
  }
}
:root[data-theme="light"] {
  --bg: #F0F7FB; --s1: #FFFFFF; --s2: #E6F3F8; --s3: #D4E9F2;
  --accent: #2878A0; --accent-d: #D0E8F5;
  --warm: #C4613A; --warm-d: #FAE8E2;
  --blue: #3A7FA0; --blue-d: #DFF0F5;
  --t1: #091922; --t2: #3A6880; --t3: #8AB0C5; --border: #BDD4E0;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg); color: var(--t1);
  min-height: 100vh; font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ─────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 0;
}
.greeting-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px; font-weight: 600; color: var(--t1); line-height: 1.1;
}
.greeting-sub { font-size: 13px; color: var(--t2); margin-top: 2px; }
.topbar-right { display: flex; gap: 8px; align-items: center; }

.btn-icon {
  width: 34px; height: 34px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--s1);
  color: var(--t2); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.btn-icon:hover { background: var(--s2); color: var(--t1); }

.btn-save {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: opacity .15s; white-space: nowrap;
}
.btn-save:hover { opacity: .85; }
.btn-save:disabled { opacity: .5; cursor: default; }

.grid {
  display: grid;
  grid-template-columns: 380px 1fr 300px;
  gap: 14px;
  padding: 14px 20px 40px;
  align-items: start;
}
@media (max-width: 980px) {
  .grid { grid-template-columns: 1fr 1fr; }
  .col-right { grid-column: 1 / -1; }
}
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .col-right { grid-column: auto; }
}

.col-left  { display: flex; flex-direction: column; gap: 14px; }
.col-mid   { display: flex; flex-direction: column; gap: 14px; }
.col-right { display: flex; flex-direction: column; gap: 14px; }

/* ── Cards ─────────────────────────────────────────────────── */
.card {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 0; margin-bottom: 12px;
}
.card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase; color: var(--t3);
}
.card-action {
  background: none; border: none; cursor: pointer;
  font-size: 18px; line-height: 1; color: var(--t2);
  transition: color .15s; padding: 0;
}
.card-action:hover { color: var(--accent); }
.card-body { padding: 0 16px 16px; }

/* ── Weather ─────────────────────────────────────────────────── */
.wx-main {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 10px;
}
.wx-temp {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 48px; font-weight: 700; color: var(--t1); line-height: 1;
}
.wx-unit { font-size: 20px; color: var(--t2); font-weight: 400; }
.wx-icon { font-size: 40px; line-height: 1; }
.wx-desc { font-size: 13px; color: var(--t2); margin-bottom: 4px; }
.wx-city { font-weight: 500; color: var(--t1); }
.wx-forecast {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 6px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 10px;
}
.wx-day {
  background: var(--s2); border-radius: 8px; padding: 8px 6px; text-align: center;
}
.wx-day-name { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }
.wx-day-icon { font-size: 20px; margin-bottom: 4px; }
.wx-day-temps { font-size: 12px; color: var(--t2); }
.wx-day-temps strong { color: var(--t1); font-weight: 500; }
.wx-loading { padding: 28px 0; text-align: center; font-size: 13px; color: var(--t2); }
.wx-error   { padding: 16px 0; text-align: center; font-size: 13px; color: var(--warm); }
.wx-city-form { display: flex; gap: 8px; margin-top: 12px; }
.wx-city-input {
  flex: 1; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px;
  font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--t1);
}
.wx-city-input:focus { outline: none; border-color: var(--accent); }
.wx-city-btn {
  padding: 8px 12px; border-radius: 8px;
  background: var(--accent); color: #fff; border: none;
  font-size: 13px; cursor: pointer; font-family: 'Outfit', sans-serif;
}
.wx-city-btn:hover { opacity: .85; }

/* ── Map / Spots ─────────────────────────────────────────────── */
.map-cat-row {
  display: flex; gap: 5px; flex-wrap: nowrap; overflow-x: auto;
  padding-bottom: 8px; margin-bottom: 8px; scrollbar-width: none;
}
.map-cat-row::-webkit-scrollbar { display: none; }
.map-cat-chip {
  padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500;
  border: 1px solid var(--border); background: var(--s2); color: var(--t2);
  cursor: pointer; transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
.map-cat-chip.active { background: var(--accent-d); border-color: var(--accent); color: var(--accent); }
.map-cat-chip:hover:not(.active) { border-color: var(--t3); color: var(--t1); }
#gmap { border-radius: 9px; height: 270px; width: 100%; }
.spot-search-wrap { margin-bottom: 8px; }
.spot-search-inp {
  width: 100%; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px;
  font-family: 'Outfit', sans-serif; font-size: 12px; color: var(--t1);
}
.spot-search-inp:focus { outline: none; border-color: var(--accent); }
#spots-list { max-height: 190px; overflow-y: auto; padding-right: 2px; margin-top: 6px; }
#spots-list::-webkit-scrollbar { width: 3px; }
#spots-list::-webkit-scrollbar-track { background: transparent; }
#spots-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.spot-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 6px; border-radius: 7px; cursor: pointer; transition: background .12s;
}
.spot-item:hover, .spot-item.active { background: var(--s2); }
.spot-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.spot-name { font-size: 12px; color: var(--t1); line-height: 1.3; }
#route-info { margin-top: 8px; }
.route-panel {
  background: var(--s2); border: 1px solid var(--border); border-radius: 9px;
  padding: 10px 12px;
}
.route-step {
  display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
}
.route-line-badge {
  background: var(--s3); border: 1px solid var(--border);
  padding: 1px 6px; border-radius: 4px; font-size: 10px;
  font-weight: 700; color: var(--accent); flex-shrink: 0;
}
.map-loading { display:flex; align-items:center; justify-content:center; height:270px; font-size:13px; color:var(--t2); background:var(--s2); border-radius:9px; }

/* ── Calendar ─────────────────────────────────────────────────── */
.cal-embed {
  width: 100%; border: none; border-radius: 9px;
  min-height: 400px; background: var(--s2);
}
.setup-box {
  padding: 20px 0; display: flex; flex-direction: column;
  align-items: center; text-align: center; gap: 10px;
}
.setup-icon  { font-size: 32px; }
.setup-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: var(--t1); }
.setup-desc  { font-size: 12px; color: var(--t2); line-height: 1.6; max-width: 300px; }
.setup-form  { display: flex; gap: 6px; width: 100%; }
.setup-input {
  flex: 1; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 11px;
  font-family: 'Outfit', sans-serif; font-size: 12px; color: var(--t1);
}
.setup-input:focus { outline: none; border-color: var(--accent); }
.setup-btn {
  padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #fff;
  border: none; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Outfit', sans-serif;
}
.setup-btn:hover { opacity: .85; }
.help-link { font-size: 11px; color: var(--blue); text-decoration: none; }
.help-link:hover { text-decoration: underline; }
.change-btn {
  background: none; border: none; cursor: pointer;
  font-size: 12px; color: var(--t3); padding: 0; transition: color .15s;
  font-family: 'Outfit', sans-serif;
}
.change-btn:hover { color: var(--warm); }

/* ── Jobs ─────────────────────────────────────────────────── */
.jobs-filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.jobs-chip {
  padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500;
  border: 1px solid var(--border); background: var(--s2); color: var(--t2);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.jobs-chip.active { background: var(--accent-d); border-color: var(--accent); color: var(--accent); }
.jobs-chip:hover:not(.active) { border-color: var(--t3); color: var(--t1); }
.job-item {
  display: flex; flex-direction: column; gap: 3px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.job-item:first-child { padding-top: 0; }
.job-item:last-child  { border-bottom: none; padding-bottom: 0; }
.job-title {
  font-size: 13px; font-weight: 500; color: var(--t1);
  text-decoration: none; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.job-title:hover { color: var(--accent); }
.job-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.job-company {
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 20px;
  background: var(--s3); color: var(--t2);
}
.job-location { font-size: 11px; color: var(--t2); }
.job-dept     { font-size: 11px; color: var(--t3); }
.jobs-loading { padding: 20px 0; text-align: center; font-size: 13px; color: var(--t2); }
.jobs-empty   { padding: 12px 0; font-size: 13px; color: var(--t3); line-height: 1.6; }
.jobs-search-row { margin-bottom: 12px; }
.jobs-search-inp {
  width: 100%; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px;
  font-family: 'Outfit', sans-serif; font-size: 12px; color: var(--t1);
}
.jobs-search-inp:focus { outline: none; border-color: var(--accent); }
.jobs-count { font-size: 11px; color: var(--t3); margin-bottom: 10px; }

/* ── Settings modal ─────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 200; display: none; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s;
}
.modal-backdrop.open { opacity: 1; }
.modal {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--radius); width: 100%; max-width: 400px;
  padding: 24px; transform: scale(.97);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-backdrop.open .modal { transform: scale(1); }
.modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 20px; }
.settings-field { margin-bottom: 14px; }
.settings-label {
  display: block; font-size: 11px; font-weight: 600;
  letter-spacing: .07em; text-transform: uppercase; color: var(--t2); margin-bottom: 6px;
}
.settings-input {
  width: 100%; background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px;
  font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--t1);
  -webkit-appearance: none;
}
.settings-input:focus { outline: none; border-color: var(--accent); }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.btn { padding: 9px 18px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
.btn-primary   { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--s2); color: var(--t1); border: 1px solid var(--border); }
.btn:hover { opacity: .85; }

/* ── Misc ─────────────────────────────────────────────────── */
.save-status { font-size: 11px; color: var(--t3); font-style: italic; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin .7s linear infinite; }
/* ── Jobs scroll ─────────────────────────────────────────── */
#jobs-body { max-height: 360px; overflow-y: auto; padding-right: 2px; }
#jobs-body::-webkit-scrollbar { width: 4px; }
#jobs-body::-webkit-scrollbar-track { background: transparent; }
#jobs-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.jobs-link-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 8px; }
.jobs-ext-link {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--s2); color: var(--accent); font-size: 12px; font-weight: 500;
  text-decoration: none; transition: border-color .15s, background .15s;
}
.jobs-ext-link:hover { border-color: var(--accent); background: var(--accent-d); }
.co-cards { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.co-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--s2); gap: 8px;
}
.co-card-name { font-size: 13px; font-weight: 600; color: var(--t1); }
.co-card-tag  { font-size: 10px; color: var(--t3); margin-top: 1px; }
.co-card-links { display: flex; gap: 6px; flex-shrink: 0; }
.co-card-btn {
  padding: 4px 10px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--s3); color: var(--t2); font-size: 11px; font-weight: 500;
  text-decoration: none; white-space: nowrap; transition: color .15s, border-color .15s;
}
.co-card-btn:hover { color: var(--accent); border-color: var(--accent); }
.co-card-btn.primary { background: var(--accent-d); border-color: var(--accent); color: var(--accent); }

/* ── News ───────────────────────────────────────────────────── */
.news-scroll { max-height: 340px; overflow-y: auto; padding: 0 16px 16px; }
.news-scroll::-webkit-scrollbar { width: 4px; }
.news-scroll::-webkit-scrollbar-track { background: transparent; }
.news-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.news-item { padding: 9px 0; border-bottom: 1px solid var(--border); }
.news-item:last-child { border-bottom: none; }
.news-link { color: var(--t1); text-decoration: none; font-size: 13px; font-weight: 500; line-height: 1.4; display: block; }
.news-link:hover { color: var(--accent); }
.news-meta { font-size: 11px; color: var(--t3); margin-top: 3px; }
.news-source { font-weight: 600; color: var(--t2); }
.news-error { color: var(--warm); font-size: 13px; padding: 12px 0; }
</style>
</head>
<body>

<!-- ── Top bar ── -->
<div class="topbar">
  <div>
    <div class="greeting-name" id="greeting-name">Good morning, Chris</div>
    <div class="greeting-sub"  id="greeting-sub"></div>
  </div>
  <div class="topbar-right">
    <span class="save-status" id="save-status"></span>
    <button class="btn-icon" id="btn-settings" title="Settings">⚙</button>
    <button class="btn-save" id="btn-save">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
  </div>
</div>

<!-- ── Grid ── -->
<div class="grid">

  <!-- Left column -->
  <div class="col-left">

    <!-- Weather -->
    <div class="card">
      <div class="card-header">
        <span class="card-title" id="wx-card-title">Weather</span>
        <button class="card-action" id="btn-refresh-wx" title="Refresh">↻</button>
      </div>
      <div id="wx-body" class="card-body">
        <div class="wx-loading">Loading weather…</div>
      </div>
    </div>

    <!-- Map / Spots -->
    <div class="card">
      <div class="card-header" style="margin-bottom:10px">
        <span class="card-title">Amsterdam Spots</span>
        <button class="card-action" id="btn-map-reset" title="Reset map" style="font-size:14px">⌂</button>
      </div>
      <div class="card-body" style="padding-top:0">
        <!-- Category filter -->
        <div class="map-cat-row" id="map-cats"></div>
        <!-- Search -->
        <div class="spot-search-wrap">
          <input class="spot-search-inp" id="spot-search" placeholder="Search your 339 spots…" autocomplete="off">
        </div>
        <!-- Map -->
        <div id="gmap-wrap">
          <div class="map-loading" id="gmap-loading"><span class="spin">↻</span>&nbsp; Loading map…</div>
          <div id="gmap" style="display:none"></div>
        </div>
        <!-- Route info -->
        <div id="route-info"></div>
        <!-- Spots list -->
        <div id="spots-list"></div>
      </div>
    </div>

  </div>

  <!-- Middle column -->
  <div class="col-mid">

    <!-- Google Calendar -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Google Calendar</span>
        <button class="change-btn card-action" id="btn-cal-change" style="display:none">Change URL</button>
      </div>
      <div class="card-body" id="cal-body"></div>
    </div>

    <!-- Vacancies -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Amsterdam Vacancies</span>
        <button class="card-action" id="btn-refresh-jobs" title="Refresh">↻</button>
      </div>
      <div class="card-body">
        <div class="jobs-filter-row" id="jobs-chips"></div>
        <div class="jobs-search-row">
          <input class="jobs-search-inp" id="jobs-search" placeholder="Filter by keyword…" type="text">
        </div>
        <div class="jobs-count" id="jobs-count"></div>
        <div id="jobs-body"><div class="jobs-loading">Loading vacancies…</div></div>
      </div>
    </div>

  </div>

  <!-- Right column — news -->
  <div class="col-right">

    <!-- Amsterdam nieuws -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Amsterdam nieuws</span>
        <button class="card-action" id="btn-refresh-at5" title="Refresh">↻</button>
      </div>
      <div class="news-scroll" id="at5-body"><div class="jobs-loading"><span class="spin">↻</span> Loading…</div></div>
    </div>

    <!-- World news -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">World news</span>
        <button class="card-action" id="btn-refresh-hn" title="Refresh">↻</button>
      </div>
      <div class="news-scroll" id="hn-body"><div class="jobs-loading"><span class="spin">↻</span> Loading…</div></div>
    </div>

    <!-- Finance & Tech news -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Finance &amp; Tech</span>
        <button class="card-action" id="btn-refresh-ft" title="Refresh">↻</button>
      </div>
      <div class="news-scroll" id="ft-body"><div class="jobs-loading"><span class="spin">↻</span> Loading…</div></div>
    </div>

  </div>
</div>

<!-- ── Settings modal ── -->
<div class="modal-backdrop" id="modal-backdrop">

    <div class="modal-footer">
      <button class="btn btn-secondary" id="s-cancel">Cancel</button>

function loadState() {
  try { const s = localStorage.getItem('dash-state'); if (s) return { ...DEFAULTS, ...JSON.parse(s) }; } catch {}
  return { ...DEFAULTS };
}
function saveState() { try { localStorage.setItem('dash-state', JSON.stringify(state)); } catch {} }

// ── Clock ──────────────────────────────────────────────────────
function updateClock() {
  const now = new Date(), h = now.getHours();
  document.getElementById('greeting-name').textContent = `Good ${h<12?'morning':h<17?'afternoon':'evening'}, ${state.name}`;
  document.getElementById('greeting-sub').textContent  = `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()} · ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
  document.title = `${state.name}'s Dashboard`;
}
setInterval(updateClock, 1000); updateClock();

// ── Map State ──────────────────────────────────────────────────
let gmap = null, gDirectionsSvc = null, gDirectionsRenderer = null, gPlacesSvc = null;
let activeMarker = null, activeInfoWindow = null;
let activeMapCat = 'all';
let mapSearchTimer = null;

// ── initMap — called by Google Maps API ───────────────────────
function initMap() {
  const mapEl = document.getElementById('gmap');
  const loadingEl = document.getElementById('gmap-loading');

  mapEl.style.display = 'block';
  if (loadingEl) loadingEl.style.display = 'none';

  gmap = new google.maps.Map(mapEl, {
    center: MAP_CENTER,
    zoom: 13,
    styles: MAP_DARK_STYLE,
    disableDefaultUI: true,
    zoomControl: true,
    zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_BOTTOM },
    gestureHandling: 'cooperative',
    clickableIcons: false,
  });

  // Home marker — Zeeburgereiland
  new google.maps.Marker({
    position: HOME_LATLNG,
    map: gmap,
    title: 'Home — Zeeburgereiland',
    zIndex: 10,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 9,
      fillColor: '#4EA8D2',
      fillOpacity: 1,
      strokeColor: '#ffffff',
      strokeWeight: 2.5,
    }
  });

  gDirectionsSvc = new google.maps.DirectionsService();
  gDirectionsRenderer = new google.maps.DirectionsRenderer({
    map: gmap,
    suppressMarkers: false,
    polylineOptions: { strokeColor: '#4EA8D2', strokeWeight: 4, strokeOpacity: 0.85 },
  });
  gPlacesSvc = new google.maps.places.PlacesService(gmap);

  renderMapCats();
  renderSpotsList();

  // Wire up spot list click — single permanent handler on the container
  document.getElementById('spots-list').addEventListener('click', e => {
    const item = e.target.closest('.spot-item');
    if (!item || !gmap) return;
    document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
    item.classList.add('active');
    searchAndShowPlace(item.dataset.name);
  });

  // Wire up spot search
  document.getElementById('spot-search').addEventListener('input', () => {
    clearTimeout(mapSearchTimer);
    mapSearchTimer = setTimeout(renderSpotsList, 160);
  });

  // Reset button
  document.getElementById('btn-map-reset').addEventListener('click', resetMap);
}

// ── Reset map ──────────────────────────────────────────────────
function resetMap() {
  if (!gmap) return;
  if (activeMarker) { activeMarker.setMap(null); activeMarker = null; }
  if (activeInfoWindow) { activeInfoWindow.close(); activeInfoWindow = null; }
  if (gDirectionsRenderer) gDirectionsRenderer.setDirections({ routes: [] });
  document.getElementById('route-info').innerHTML = '';
  document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
  gmap.panTo(MAP_CENTER);
  gmap.setZoom(13);
}

// ── Category chips ─────────────────────────────────────────────
function renderMapCats() {
  const cats = ['all','restaurants','bars','coffee','nightlife','sports','activity','culture','wellness','outdoor'];
  const row = document.getElementById('map-cats');
  row.innerHTML = cats.map(c =>
    `<button class="map-cat-chip${c===activeMapCat?' active':''}" data-cat="${c}">${CAT_META[c].label}</button>`
  ).join('');
  row.addEventListener('click', e => {
    const btn = e.target.closest('.map-cat-chip');
    if (!btn) return;
    activeMapCat = btn.dataset.cat;
    document.querySelectorAll('.map-cat-chip').forEach(b => b.classList.toggle('active', b.dataset.cat === activeMapCat));
    renderSpotsList();
  });
}

// ── Spots List ─────────────────────────────────────────────────
function renderSpotsList() {
  const q = (document.getElementById('spot-search')?.value || '').toLowerCase().trim();
  const filtered = PLACES.filter(p => {
    const catOk = activeMapCat === 'all' || p.c === activeMapCat;
    const txtOk = !q || p.n.toLowerCase().includes(q);
    return catOk && txtOk;
  });

  const list = document.getElementById('spots-list');

// ── Search & Show Place ────────────────────────────────────────
function searchAndShowPlace(name) {
  if (!gPlacesSvc) return;

  const routeEl = document.getElementById('route-info');
  routeEl.innerHTML = `<div style="font-size:12px;color:var(--t2);padding:8px 0"><span class="spin">↻</span>&nbsp; Finding "${name}"…</div>`;

  // findPlaceFromQuery is more accurate for specific names; textSearch as fallback
  gPlacesSvc.findPlaceFromQuery({
    query: name + ' Amsterdam',
    fields: ['geometry', 'name', 'formatted_address'],
  }, (r1, s1) => {
    if (s1 === google.maps.places.PlacesServiceStatus.OK && r1?.length) {
      _placeFound(name, r1[0]);
    } else {
      gPlacesSvc.textSearch({ query: name + ' Amsterdam' }, (r2, s2) => {
        if (s2 === google.maps.places.PlacesServiceStatus.OK && r2?.length) {
          _placeFound(name, r2[0]);
        } else {
          routeEl.innerHTML = `<div style="font-size:12px;color:var(--warm);padding:6px 0">Could not find "${esc(name)}" on Google Maps.</div>`;
        }
      });
    }
  });
}

function _placeFound(name, place) {
  const routeEl = document.getElementById('route-info');
  {
    const loc   = place.geometry.location;
    const color = CAT_META[PLACES.find(p=>p.n===name)?.c]?.color || '#E07A5F';

    // Clear previous
    if (activeMarker)     { activeMarker.setMap(null); }
    if (activeInfoWindow) { activeInfoWindow.close(); }
    if (gDirectionsRenderer) gDirectionsRenderer.setDirections({ routes: [] });

    // Place marker
    activeMarker = new google.maps.Marker({
      position: loc,
      map: gmap,
      title: name,
      animation: google.maps.Animation.DROP,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 10,
        fillColor: color,
        fillOpacity: 1,
        strokeColor: '#ffffff',
        strokeWeight: 2,
      },
      zIndex: 20,
    });

    gmap.panTo(loc);
    gmap.setZoom(15);

    // InfoWindow
    const lat = loc.lat(), lng = loc.lng();
    activeInfoWindow = new google.maps.InfoWindow({
      content: `<div style="font-family:'Outfit',sans-serif;min-width:160px;padding:4px 2px">
        <div style="font-weight:600;font-size:13px;color:#111;margin-bottom:8px;line-height:1.3">${name.replace(/"/g,'&quot;')}</div>
        <button onclick="showRoute({lat:${lat},lng:${lng}})"
          style="width:100%;padding:7px 10px;background:#4EA8D2;color:#fff;border:none;border-radius:7px;
                 cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;letter-spacing:.02em">
          🚌 Route from home
        </button>
      </div>`,
      maxWidth: 220,
    });
    activeInfoWindow.open(gmap, activeMarker);
    activeMarker.addListener('click', () => activeInfoWindow.open(gmap, activeMarker));

    // Info panel
    const addr = place.formatted_address ? place.formatted_address.replace(/, Netherlands$/,'') : '';
    routeEl.innerHTML = `
      <div class="route-panel" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div style="min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div>
          ${addr ? `<div style="font-size:11px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(addr)}</div>` : ''}
        </div>
        <button onclick="showRoute({lat:${lat},lng:${lng}})"
          style="flex-shrink:0;padding:6px 12px;background:var(--accent-d);border:1px solid var(--accent);
                 color:var(--accent);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;
                 font-family:inherit;white-space:nowrap">
          🚌 Route
        </button>
      </div>`;
  }
}

// ── Transit Route ─────────────────────────────────────────────
function showRoute(dest) {
  if (!gDirectionsSvc) return;

  const routeEl = document.getElementById('route-info');
  routeEl.innerHTML = `<div style="font-size:12px;color:var(--t2);padding:8px 0"><span class="spin">↻</span>&nbsp; Getting transit route…</div>`;

  gDirectionsSvc.route({
    origin: HOME_LATLNG,
    destination: dest,
    travelMode: google.maps.TravelMode.TRANSIT,
    transitOptions: { departureTime: new Date(), modes: ['BUS','RAIL','SUBWAY','TRAM'] },
  }, (result, status) => {
    if (status !== 'OK') {
      // Try walking as fallback
      gDirectionsSvc.route({
        origin: HOME_LATLNG, destination: dest,
        travelMode: google.maps.TravelMode.WALKING,
      }, (r2, s2) => {
        if (s2 === 'OK') {
          gDirectionsRenderer.setDirections(r2);
          const leg = r2.routes[0].legs[0];
          routeEl.innerHTML = `
            <div class="route-panel">
              <div style="font-size:11px;color:var(--t3);margin-bottom:6px">🚶 Walking route from Zeeburgereiland</div>
              <div style="font-size:16px;font-weight:700;color:var(--t1)">${leg.duration.text}</div>
              <div style="font-size:11px;color:var(--t2);margin-top:2px">${leg.distance.text}</div>
            </div>`;
        } else {
          routeEl.innerHTML = `<div style="font-size:12px;color:var(--warm);padding:8px 0">No route found. Try <a href="https://9292.nl" target="_blank" style="color:var(--accent)">9292.nl ↗</a></div>`;
        }
      });
      return;
    }

    gDirectionsRenderer.setDirections(result);
    const leg = result.routes[0].legs[0];

    // Build step summary
    const transitSteps = leg.steps.filter(s => s.travel_mode === 'TRANSIT');
    const stepsHtml = transitSteps.map(s => {
      const t = s.transit;
      const lineName = t.line?.short_name || t.line?.name || '?';
      const depStop  = t.departure_stop?.name || '';
      const arrStop  = t.arrival_stop?.name || '';
      const numStops = t.num_stops || '';
      return `<div class="route-step">
        <span class="route-line-badge">${esc(lineName)}</span>
        <span style="font-size:11px;color:var(--t2)">${esc(depStop)} → ${esc(arrStop)}${numStops ? ` (${numStops} stops)` : ''}</span>
      </div>`;
    }).join('');

    routeEl.innerHTML = `
      <div class="route-panel">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
          <div style="font-size:18px;font-weight:700;color:var(--t1)">${leg.duration.text}</div>
          <div style="font-size:11px;color:var(--t2)">${leg.distance.text} · from Zeeburgereiland</div>
        </div>
        ${stepsHtml || '<div style="font-size:11px;color:var(--t3)">Direct connection</div>'}
        <div style="font-size:10px;color:var(--t3);margin-top:8px">Departs now · <a href="https://9292.nl" target="_blank" style="color:var(--accent)">9292.nl ↗</a></div>
      </div>`;
  });
}


// ── Weather ────────────────────────────────────────────────────
const WMO = {
  0:'☀️ Clear',1:'🌤️ Mainly clear',2:'⛅ Partly cloudy',3:'☁️ Overcast',
  45:'🌫️ Fog',48:'🌫️ Icy fog',
  51:'🌦️ Light drizzle',53:'🌦️ Drizzle',55:'🌧️ Heavy drizzle',
  61:'🌧️ Light rain',63:'🌧️ Rain',65:'🌧️ Heavy rain',
  71:'🌨️ Light snow',73:'❄️ Snow',75:'❄️ Heavy snow',77:'🌨️ Snow grains',
  80:'🌦️ Showers',81:'🌧️ Rain showers',82:'🌧️ Heavy showers',
  85:'🌨️ Snow showers',86:'❄️ Heavy snow showers',
  95:'⛈️ Thunderstorm',96:'⛈️ Thunderstorm + hail',99:'⛈️ Thunderstorm + hail',
};
const wmoIcon = c => (WMO[c]||'🌡️ Unknown').split(' ')[0];
const wmoDesc = c => (WMO[c]||'Unknown').split(' ').slice(1).join(' ');
const fmtDay  = s => { const [y,m,d]=s.split('-').map(Number); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(y,m-1,d).getDay()]; };

async function fetchWeather(lat, lon, cityName) {
  const res  = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,windspeed_10m&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto&forecast_days=4&wind_speed_unit=kmh`);
  const data = await res.json();
  const cur  = data.current, d = data.daily;
  document.getElementById('wx-card-title').textContent = cityName + ' Weather';
  document.getElementById('wx-body').innerHTML = `
    <div class="wx-main">
      <div>
        <div class="wx-temp">${Math.round(cur.temperature_2m)}<span class="wx-unit">°C</span></div>
        <div class="wx-desc">${wmoDesc(cur.weathercode)} · ${Math.round(cur.windspeed_10m)} km/h</div>
        <div class="wx-desc"><span class="wx-city">${esc(cityName)}</span></div>
      </div>
      <div class="wx-icon">${wmoIcon(cur.weathercode)}</div>
    </div>
    <div class="wx-forecast">
      ${[1,2,3].map(i=>`<div class="wx-day">
        <div class="wx-day-name">${fmtDay(d.time[i])}</div>
        <div class="wx-day-icon">${wmoIcon(d.weathercode[i])}</div>
        <div class="wx-day-temps"><strong>${Math.round(d.temperature_2m_max[i])}°</strong> / ${Math.round(d.temperature_2m_min[i])}°</div>
      </div>`).join('')}
    </div>
    <div class="wx-city-form">
      <input class="wx-city-input" id="wx-city-inp" placeholder="Change city…">
      <button class="wx-city-btn" id="wx-city-btn">Go</button>
    </div>`;
  bindCityBtn();
}
function showWxError(msg) {
  document.getElementById('wx-body').innerHTML = `
    <div class="wx-error">${esc(msg)}</div>
    <div class="wx-city-form" style="margin-top:0">
      <input class="wx-city-input" id="wx-city-inp" placeholder="Enter city…">
      <button class="wx-city-btn" id="wx-city-btn">Go</button>
    </div>`;
  bindCityBtn();
}
function bindCityBtn() {
  const btn = document.getElementById('wx-city-btn');
  if (!btn) return;
  const go = async () => {
    const v = document.getElementById('wx-city-inp')?.value.trim();
    if (!v) return;
    state.city = v;
    document.getElementById('wx-body').innerHTML = '<div class="wx-loading">Looking up…</div>';
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=1&language=en&format=json`);
      const j = await r.json();
      if (!j.results?.length) throw new Error();
      const {latitude:lat,longitude:lon,name,country} = j.results[0];
      await fetchWeather(lat, lon, name+(country?', '+country:''));
    } catch { showWxError(`"${v}" not found — try another city name.`); }
  };
  btn.addEventListener('click', go);
  document.getElementById('wx-city-inp')?.addEventListener('keydown', e => { if(e.key==='Enter') go(); });
}
async function loadWeather() {
  document.getElementById('wx-body').innerHTML = '<div class="wx-loading">Loading weather…</div>';
  if (state.city) {
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(state.city)}&count=1&language=en&format=json`);
      const j = await r.json();
      if (!j.results?.length) throw new Error();
      const {latitude:lat,longitude:lon,name,country} = j.results[0];
      await fetchWeather(lat, lon, name+(country?', '+country:'')); return;
    } catch { showWxError(`Could not load weather for "${state.city}".`); return; }
  }
  if (!navigator.geolocation) { showWxError('Enter a city to see weather.'); return; }
  navigator.geolocation.getCurrentPosition(
    async p => {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${p.coords.latitude}&lon=${p.coords.longitude}&format=json`);
        const j = await r.json();
        await fetchWeather(p.coords.latitude, p.coords.longitude, j.address?.city || j.address?.town || 'Your location');
      } catch { await fetchWeather(p.coords.latitude, p.coords.longitude, 'Your location'); }
    },
    () => showWxError('Location denied — enter a city above.'),
    { timeout: 8000 }
  );
}

  { name: 'All' },
  { name: 'Adyen',       greenhouse: 'adyen',  url: 'https://careers.adyen.com',           liId: '143879', label: 'Fintech / Payments' },

];
let allJobs = [], activeCompany = 'All';
const isAmsterdam = loc => !loc || /amsterdam|netherlands|nederland|\bnl\b/i.test(loc);

async function fetchGreenhouse(slug) {
  try {
    const res = await fetch(`https://boards-api.greenhouse.io/v1/boards/${slug}/jobs?content=true`, { signal: AbortSignal.timeout(10000) });
    if (!res.ok) throw new Error();
    const data = await res.json();
    return (data.jobs||[]).map(j => ({ title:j.title, url:j.absolute_url, location:j.location?.name||'', dept:j.departments?.[0]?.name||'' }));
  } catch { return []; }
}

async function loadJobs() {
  document.getElementById('jobs-body').innerHTML = '<div class="jobs-loading"><span class="spin">↻</span> Loading…</div>';
  document.getElementById('jobs-count').textContent = '';
  const fetches = JOB_COMPANIES.filter(c => c.name !== 'All').map(c => {
    if (!c.greenhouse) return Promise.resolve([]);
    return fetchGreenhouse(c.greenhouse)
      .then(jobs => jobs.map(j => ({ ...j, company: c.name, companyUrl: c.url })));
  });
  allJobs = (await Promise.all(fetches)).flat();
  renderJobs();
}
function renderJobs() {
  const searchQ = (document.getElementById('jobs-search')?.value||'').toLowerCase().trim();
  const amsterdamJobs = allJobs.filter(j => isAmsterdam(j.location));
  const filtered = amsterdamJobs.filter(j => {
    const matchCo = activeCompany === 'All' || j.company === activeCompany;
    const matchQ  = !searchQ || j.title.toLowerCase().includes(searchQ) || j.dept.toLowerCase().includes(searchQ) || j.location.toLowerCase().includes(searchQ);
    return matchCo && matchQ;
  });
  document.getElementById('jobs-count').textContent = filtered.length ? `${filtered.length} Amsterdam role${filtered.length!==1?'s':''}` : '';
  function coCard(co) {
    const liUrl = co.liId
      ? `https://www.linkedin.com/jobs/search/?f_C=${co.liId}&location=Amsterdam%2C+Netherlands`
      : `https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(co.name)}&location=Amsterdam%2C+Netherlands`;
    return `<div class="co-card">
      <div><div class="co-card-name">${esc(co.name)}</div><div class="co-card-tag">${esc(co.label||'')}</div></div>
      <div class="co-card-links">
        <a class="co-card-btn primary" href="${esc(liUrl)}" target="_blank" rel="noopener">LinkedIn ↗</a>
        <a class="co-card-btn" href="${esc(co.url)}" target="_blank" rel="noopener">Careers ↗</a>
      </div>
    </div>`;
  }
  if (!filtered.length) {
    const co = activeCompany !== 'All' ? JOB_COMPANIES.find(c => c.name === activeCompany) : null;
    if (co && !co.greenhouse) {
      document.getElementById('jobs-body').innerHTML = `<div class="jobs-empty" style="margin-bottom:10px">No direct API — open job boards:</div><div class="co-cards">${coCard(co)}</div>`;
    } else if (!allJobs.length) {
      document.getElementById('jobs-body').innerHTML = '<div class="jobs-empty">Could not load vacancies. Check back later.</div>';
    } else {
      document.getElementById('jobs-body').innerHTML = `<div class="jobs-empty">No Amsterdam matches${activeCompany !== 'All' ? ' at ' + esc(activeCompany) : ''}.</div>`;
    }
    return;
  }
  const listHtml = filtered.slice(0,20).map(j => `
    <div class="job-item">
      <a class="job-title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      <div class="job-meta">
        <span class="job-company">${esc(j.company)}</span>
        ${j.location ? `<span class="job-location">📍 ${esc(j.location)}</span>` : ''}
        ${j.dept     ? `<span class="job-dept">${esc(j.dept)}</span>` : ''}
      </div>
    </div>`).join('');
  let cardsHtml = '';
  if (activeCompany === 'All') {
    const noFeed = JOB_COMPANIES.filter(c => c.name !== 'All' && !c.greenhouse);
    if (noFeed.length) {
      cardsHtml = `<div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);padding:14px 0 8px">Also hiring in Amsterdam</div>
        <div class="co-cards">${noFeed.map(coCard).join('')}</div>`;
    }
  }
  document.getElementById('jobs-body').innerHTML = listHtml + cardsHtml;
}
function renderJobChips() {
  const row = document.getElementById('jobs-chips');
  row.innerHTML = JOB_COMPANIES.map(c => `<button class="jobs-chip${c.name===activeCompany?' active':''}" data-co="${esc(c.name)}">${esc(c.name)}</button>`).join('');
  row.addEventListener('click', e => {
    const btn = e.target.closest('.jobs-chip');
    if (!btn) return;
    activeCompany = btn.dataset.co;
    document.querySelectorAll('.jobs-chip').forEach(b => b.classList.toggle('active', b.dataset.co === activeCompany));
    renderJobs();
  });
}

async function loadAT5() {

  function renderNewsItems(items, source) {
    return items.slice(0, 10).map(item => {
      const ago = item.pubDate ? timeAgo(new Date(item.pubDate)) : '';
      return `<div class="news-item">
        <a class="news-link" href="${esc(item.link)}" target="_blank" rel="noopener">${esc(item.title)}</a>

  const FEEDS = [
    { url: 'https://www.at5.nl/nieuws/rss',         source: 'AT5' },
    { url: 'https://at5.nl/rss.xml',                source: 'AT5' },
    { url: 'https://www.nu.nl/rss/amsterdam',       source: 'nu.nl' },
    { url: 'https://feeds.nos.nl/nosnieuws',        source: 'NOS' },

  for (const feed of FEEDS) {

      if (data.status === 'ok' && data.items?.length) { body.innerHTML = renderNewsItems(data.items, feed.source); return; }

          const ago = item.pubDate ? timeAgo(new Date(item.pubDate)) : '';
          return `<div class="news-item">
            <a class="news-link" href="${esc(item.link)}" target="_blank" rel="noopener">${esc(item.title)}</a>
            <div class="news-meta">${ago ? ago + ' · ' : ''}<span class="news-source">${esc(feed.source)}</span></div>
          </div>`;
        }).join('');
        return;
      }
    } catch { /* try next */ }
  }
  body.innerHTML = `<div class="news-error">Could not load finance news.</div>
    <a href="https://www.cnbc.com" target="_blank" rel="noopener" style="color:var(--accent);font-size:13px;text-decoration:none;display:block;margin-top:6px">Open CNBC ↗</a>`;
}

// ── Time helper ───────────────────────────────────────────────
function timeAgo(date) {
  const secs = Math.floor((Date.now() - date) / 1000);
  if (secs < 60)    return 'just now';
  if (secs < 3600)  return `${Math.floor(secs/60)}m ago`;
  if (secs < 86400) return `${Math.floor(secs/3600)}h ago`;
  return `${Math.floor(secs/86400)}d ago`;
}

// ── Google Calendar ────────────────────────────────────────────
function renderCalendar() {
  const body = document.getElementById('cal-body'), changeBtn = document.getElementById('btn-cal-change');
  if (state.calendarUrl) {
    body.innerHTML = `
      <iframe class="cal-embed" src="${esc(state.calendarUrl)}" frameborder="0" scrolling="no" allowfullscreen></iframe>
      <div style="padding-top:8px;font-size:11px;color:var(--t3)">
        Your Google Calendar · <a class="help-link" href="https://calendar.google.com" target="_blank">Open Calendar ↗</a>
      </div>`;
    changeBtn.style.display = 'inline-block';
  } else {
    changeBtn.style.display = 'none';
    body.innerHTML = `
      <div class="setup-box">
        <div class="setup-icon">📅</div>
        <div class="setup-title">Connect your Google Calendar</div>
        <div class="setup-desc">Open Google Calendar → Settings (⚙) → your calendar → "Integrate calendar" → copy the <strong>Embed code</strong> URL and paste it below.</div>
        <div class="setup-form">
          <input class="setup-input" id="cal-url-inp" placeholder="https://calendar.google.com/calendar/embed?src=…" type="url">
          <button class="setup-btn" id="cal-url-btn">Connect</button>
        </div>
        <a class="help-link" href="https://support.google.com/calendar/answer/41207" target="_blank" rel="noopener">How to find the embed URL ↗</a>
      </div>`;
    const btn = document.getElementById('cal-url-btn');
    btn.addEventListener('click', () => { const u = document.getElementById('cal-url-inp').value.trim(); if (!u) return; state.calendarUrl = u; saveState(); renderCalendar(); });
    document.getElementById('cal-url-inp').addEventListener('keydown', e => { if (e.key==='Enter') btn.click(); });
  }
}

// ── Settings ───────────────────────────────────────────────────
function openSettings() {
  document.getElementById('s-name').value = state.name;
  document.getElementById('s-city').value = state.city;
  const bd = document.getElementById('modal-backdrop');
  bd.style.display = 'flex'; requestAnimationFrame(() => bd.classList.add('open'));
}
function closeSettings() {
  const bd = document.getElementById('modal-backdrop');
  bd.classList.remove('open'); setTimeout(() => { bd.style.display = 'none'; }, 220);
}

// ── Save ───────────────────────────────────────────────────────
function saveDash() {
  const btn = document.getElementById('btn-save'), status = document.getElementById('save-status');
  btn.disabled = true; btn.innerHTML = '<span class="spin">↻</span> Saving…';
  saveState();
  setTimeout(() => {
    status.textContent = `Saved ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
    btn.disabled = false;
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save`;
  }, 400);
}

// ── Init ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-refresh-wx').addEventListener('click', loadWeather);
  document.getElementById('btn-cal-change').addEventListener('click', () => { state.calendarUrl = ''; saveState(); renderCalendar(); });
  document.getElementById('btn-refresh-jobs').addEventListener('click', loadJobs);
  document.getElementById('jobs-search').addEventListener('input', renderJobs);
  document.getElementById('btn-settings').addEventListener('click', openSettings);
  document.getElementById('s-cancel').addEventListener('click', closeSettings);
  document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target===e.currentTarget) closeSettings(); });
  document.getElementById('s-save').addEventListener('click', () => {
    state.name = document.getElementById('s-name').value.trim() || state.name;
    state.city = document.getElementById('s-city').value.trim();
    saveState(); closeSettings(); updateClock(); loadWeather();
  });
  document.getElementById('btn-save').addEventListener('click', saveDash);
  document.getElementById('btn-refresh-at5').addEventListener('click', loadAT5);
  document.getElementById('btn-refresh-hn').addEventListener('click', loadHN);
  document.getElementById('btn-refresh-ft').addEventListener('click', loadFT);

  renderCalendar();
  renderJobChips();
  loadWeather();
  loadJobs();
  loadAT5();
  loadHN();
  loadFT();
});
</script>
</body>
